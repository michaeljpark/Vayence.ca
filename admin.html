<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manage releases — Vayence Inc</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="admin">
  <div class="page">

    <!-- Header and footer are rendered by main.js from one site map -->
    <header class="header" id="top" data-site-header></header>

    <main class="subpage">
      <section class="section section--white">
        <div class="intro__head">
          <h1 class="intro__title">Manage releases</h1>
          <div class="intro__lead">
            <p class="statement statement--lg">Write and edit posts <span class="muted">for Awards, Updates and the Newsletter. Changes go live about a minute after you save.</span></p>
          </div>
        </div>

        <!-- Signed out -->
        <div class="admin-signin" data-admin-signin>
          <p class="lead">Sign in with the Vayence Inc Google account to continue.</p>
          <div data-google-button></div>
          <p class="small form__status" data-signin-status role="status" aria-live="polite"></p>
        </div>

        <!-- Signed in: post list -->
        <div class="admin" data-admin hidden>
          <div class="admin__bar">
            <p class="small muted">Signed in as <span data-admin-email></span> · <button class="admin__link" type="button" data-sign-out>Sign out</button></p>
            <div class="admin__actions">
              <label class="field admin__filter">
                <span class="field__label">Show</span>
                <select class="field__box field__select" data-filter>
                  <option value="Newsletter">Newsletter</option>
                  <option value="Updates">Updates</option>
                  <option value="Awards">Awards</option>
                  <option value="">All posts</option>
                </select>
              </label>
              <button class="btn btn--secondary" type="button" data-open-settings>Page text</button>
              <button class="btn btn--primary" type="button" data-new>New post</button>
            </div>
          </div>
          <div class="post-list" data-admin-list></div>
          <p class="small form__status" data-list-status role="status" aria-live="polite"></p>
        </div>

        <!-- Page text: Releases page headings and the contact form's options (assets/data/site.json) -->
        <form class="form admin-settings" data-settings novalidate hidden>
          <button class="admin__link admin-editor__back" type="button" data-settings-cancel>← Back to posts</button>
          <h2 class="h3">Page text</h2>

          <fieldset class="admin-settings__group">
            <legend class="field__label">Releases page</legend>
            <label class="field">
              <span class="field__label">Page title</span>
              <input class="field__box" type="text" name="title" maxlength="60" required>
            </label>
            <div class="form__row">
              <label class="field">
                <span class="field__label">Intro <span class="muted">— dark part</span></span>
                <input class="field__box" type="text" name="lead" maxlength="200" required>
              </label>
              <label class="field">
                <span class="field__label">Intro <span class="muted">— grey part, optional</span></span>
                <input class="field__box" type="text" name="leadMuted" maxlength="300">
              </label>
            </div>
          </fieldset>

          <fieldset class="admin-settings__group" data-sections></fieldset>

          <fieldset class="admin-settings__group">
            <legend class="field__label">Contact form</legend>
            <label class="field">
              <span class="field__label">“I am a” options <span class="muted">— one per line, in order</span></span>
              <textarea class="field__box field__box--area" name="roles" rows="6" required></textarea>
            </label>
          </fieldset>

          <div class="form__submit">
            <button class="btn btn--primary" type="submit" data-settings-save>Save page text</button>
            <p class="small form__status" data-settings-status role="status" aria-live="polite"></p>
          </div>
        </form>

        <!-- Editor: the document on the left, post settings on the right -->
        <form class="admin-editor" data-editor novalidate hidden>
          <div class="admin-editor__top">
            <button class="admin__link admin-editor__back" type="button" data-cancel>← Back to posts</button>
            <p class="small muted admin-editor__draft" data-draft-status role="status" aria-live="polite"></p>
          </div>
          <div class="admin-editor__grid">
            <div class="admin-editor__main">
              <p class="chip" data-editor-title>New post</p>
              <textarea class="admin-editor__title" name="title" rows="1" maxlength="200" placeholder="Title" aria-label="Title" required></textarea>
              <textarea class="admin-editor__excerpt" name="excerpt" rows="2" maxlength="400" placeholder="Summary: one or two sentences, shown in lists and search results" aria-label="Summary" required></textarea>
              <div data-doc></div>
            </div>

            <aside class="admin-editor__side form">
              <div class="admin-editor__publish">
                <button class="btn btn--primary" type="submit" data-save>Publish</button>
                <p class="small form__status" data-editor-status role="status" aria-live="polite"></p>
              </div>
              <label class="field">
                <span class="field__label">Section</span>
                <select class="field__box field__select" name="category">
                  <option>Newsletter</option>
                  <option>Updates</option>
                  <option>Awards</option>
                </select>
              </label>
              <label class="field">
                <span class="field__label">Date *</span>
                <input class="field__box" type="date" name="date" required>
              </label>
              <label class="field">
                <span class="field__label">Date shown</span>
                <input class="field__box" type="text" name="dateLabel" placeholder="From the date" maxlength="40">
              </label>

              <div class="field">
                <span class="field__label">Cover image <span class="muted">— or the first picture in the post</span></span>
                <figure class="admin-editor__preview" hidden><img data-preview alt=""></figure>
                <input class="field__box admin-editor__file" type="file" name="image" accept="image/jpeg,image/png,image/webp" aria-label="Cover image">
              </div>
              <label class="field">
                <span class="field__label">Cover description <span class="muted">— for screen readers and search</span></span>
                <input class="field__box" type="text" name="imageAlt" maxlength="300">
              </label>

              <label class="field">
                <span class="field__label">Closing quote</span>
                <textarea class="field__box field__box--area admin-editor__short" name="quoteText" maxlength="1000" placeholder="Optional"></textarea>
              </label>
              <label class="field">
                <span class="field__label">Quote by</span>
                <input class="field__box" type="text" name="quoteCite" maxlength="200" placeholder="e.g. Marzuq Vohra, co-founder">
              </label>
              <label class="field">
                <span class="field__label">Source name</span>
                <input class="field__box" type="text" name="sourceName" maxlength="100" placeholder="e.g. OCAD University">
              </label>
              <label class="field">
                <span class="field__label">Source link</span>
                <input class="field__box" type="url" name="sourceUrl" maxlength="500" placeholder="https://">
              </label>
              <label class="field">
                <span class="field__label">More links <span class="muted">— one per line: Label | https://…</span></span>
                <textarea class="field__box field__box--area admin-editor__short" name="links" spellcheck="false"></textarea>
              </label>
              <label class="field">
                <span class="field__label">Videos <span class="muted">— one per line: Title | Vimeo or YouTube link | 2:09</span></span>
                <textarea class="field__box field__box--area admin-editor__short" name="videos" spellcheck="false"></textarea>
              </label>
              <button class="admin__link admin__link--danger" type="button" data-delete hidden>Delete post</button>
            </aside>
          </div>
        </form>
      </section>
    </main>

    <footer class="footer" data-site-footer></footer>

  </div>
  <script src="main.js"></script>
  <script src="https://accounts.google.com/gsi/client" async></script>
  <script src="doc-editor.js"></script>
  <script src="admin.js"></script>
</body>
</html>
